name: SSH Debug — Project Humanity

on:
  workflow_dispatch:

jobs:
  debug-ssh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check if SSH_PRIVATE_KEY secret is set
        run: |
          if [ -z "${SSH_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty or not set."
            exit 1
          else
            echo "SSH_PRIVATE_KEY secret is present."
          fi
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          echo "Key file written. Lines:"
          wc -l ~/.ssh/deploy_key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan and verify server host key
        run: |
          ssh-keyscan -t rsa,ecdsa,ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -l -f ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Test SSH connection with verbose debug output
        run: |
          echo "Initiating SSH connection to $SSH_USER@$SSH_HOST..."
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -v \
              "$SSH_USER@$SSH_HOST" "echo 'Connection successful. PWD: $(pwd)'" 2>&1 | \
          grep -E "(debug1:|Authentication|Permission|Disconnect|sign_and_send_pubkey|Connection successful)"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

name: Secure Deploy Project Humanity

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: deploy-project-humanity
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: gd, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, session, zip
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=512M

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Validate PHP Syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Check Critical Files Exist
        run: |
          test -f public_html/index.php
          test -f app/bootstrap.php
          test -f container.php
          test -f config.php
          test -d migrations
          echo "Critical structure verified."

      - name: Prepare SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify Server PHP 8.5
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "php -r 'exit(PHP_VERSION_ID >= 80512 ? 0 : 1);'"

      - name: Real Deploy via Rsync
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='/vendor/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='.well-known/'
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.cache/' \
            --exclude='migration_dump.txt' \
            --exclude='all_php_merged.txt' \
            --exclude='.env*' \
            --exclude='config/.env*' \
            --exclude='config/.settings.config' \
            --exclude='/storage/' \
            --exclude='/logs/' \
            --exclude='backup_*' \
            --exclude='quarantine_*' \
            --exclude='*.log' \
            --exclude='*.bak' \
            --exclude='*.old' \
            --exclude='*.orig' \
            --exclude='*.save' \
            --exclude='*.swp' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE' \
            --exclude='CONTRIBUTING.md' \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Post-Deploy Tasks (Composer & Migrations)
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -euo pipefail
            cd "$DEPLOY_PATH"

            echo "Server PHP:"
            php -v

            echo "Checking platform requirements..."
            COMPOSER_ALLOW_SUPERUSER=1 composer check-platform-reqs --no-dev

            echo "Running composer install..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "Running migrations..."
            if [ -f "bin/run_migrations.php" ]; then
              php bin/run_migrations.php
            else
              echo "ERROR: bin/run_migrations.php not found!"
              exit 1
            fi

            echo "Deployment finished successfully."
          EOF

      - name: Health Check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null https://projecthumanity.space/; then
              echo "Health check passed."
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done
          echo "Health check failed."
          exit 1
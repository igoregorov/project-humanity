name: Secure Deploy Project Humanity

on:
  workflow_dispatch:
  
  pull_request:
    branches: [ master ]
    
  push:
    branches: [ master ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, pdo_mysql, mbstring, fileinfo, openssl
          tools: composer:v2

      - name: Validate PHP Syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Check Critical Files Exist
        run: |
          test -f public_html/index.php || exit 1
          test -f app/bootstrap.php || exit 1
          test -f container.php || exit 1
          test -f config.php || exit 1
          echo "Critical structure verified."

      - name: Prepare SSH Key
        if: github.event_name != 'pull_request' || contains(github.head_ref, 'debug-ssh')
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync Dry Run (Preview Changes)
        if: github.event_name != 'pull_request' || contains(github.head_ref, 'debug-ssh')
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avzn --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='config/.env*' \
            --exclude='config/.settings.config' \
            --exclude='storage/*' \
            --exclude='logs/*' \
            --exclude='backup_*' \
            --exclude='quarantine_*' \
            --exclude='*.log' \
            --exclude='*.sql' \
            --exclude='*.bak' \
            --exclude='*.old' \
            --exclude='*.orig' \
            --exclude='*.save' \
            --exclude='*.swp' \
            --exclude='all_php_merged.txt' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE' \
            --exclude='CONTRIBUTING.md' \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Real Deploy via Rsync
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='config/.env*' \
            --exclude='config/.settings.config' \
            --exclude='storage/*' \
            --exclude='logs/*' \
            --exclude='backup_*' \
            --exclude='quarantine_*' \
            --exclude='*.log' \
            --exclude='*.sql' \
            --exclude='*.bak' \
            --exclude='*.old' \
            --exclude='*.orig' \
            --exclude='*.save' \
            --exclude='*.swp' \
            --exclude='all_php_merged.txt' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE' \
            --exclude='CONTRIBUTING.md' \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Post-Deploy Tasks (Composer & Migrations)
        # Тоже заблокировано для PR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /var/www/vhosts/projecthumanity.space
            
            echo "Running composer install..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "Fixing permissions..."
            find storage -type d -exec chmod 2775 {} \;
            find storage -type f -exec chmod 664 {} \;
            find logs -type d -exec chmod 2775 {} \;
            
            echo "Running migrations..."
            php bin/run_migrations.php
            
            echo "Deployment finished successfully."
          EOF

      - name: Install Let's Encrypt Root Certificates
        run: |
          sudo curl -fsSL https://letsencrypt.org/certs/isrgrootx1.pem \
            -o /usr/local/share/ca-certificates/isrg-root-x1.crt
          sudo curl -fsSL https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem \
            -o /usr/local/share/ca-certificates/root-yr-by-x1.crt
          sudo update-ca-certificates

      - name: Health Check
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        run: |
          curl -I https://projecthumanity.space/ | grep "HTTP/2 200" || curl -I http://projecthumanity.space/ | grep "HTTP/1.1 200"


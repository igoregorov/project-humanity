name: Project Humanity — Manual Deploy & Debug

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4 # Обновлено с v3 на v4, чтобы убрать варнинг про Node 20
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.env*' \
            --exclude='config/.settings.config' \
            --exclude='storage/' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            ./ "$SSH_USER@$SSH_HOST:/var/www/vhosts/projecthumanity.space/public_html/"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd /var/www/vhosts/projecthumanity.space/public_html && php run_migrations.php"

    env:
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

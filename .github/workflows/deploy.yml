name: Secure Deploy Project Humanity

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: gd, pdo_mysql, mbstring, fileinfo, openssl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate PHP Syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Check Critical Files Exist
        run: |
          test -f public_html/index.php || exit 1
          test -f app/bootstrap.php || exit 1
          test -f container.php || exit 1
          test -f config.php || exit 1
          test -d migrations || exit 1 # <-- ДОБАВЛЕНО: Проверка наличия папки миграций
          echo "Critical structure verified."

      - name: Prepare SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Real Deploy via Rsync
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='/vendor/' \
            --exclude='/node_modules/' \
            --exclude='.env*' \
            --exclude='config/.env*' \
            --exclude='config/.settings.config' \
            --exclude='/storage/' \
            --exclude='/logs/' \
            --exclude='backup_*' \
            --exclude='quarantine_*' \
            --exclude='*.log' \
            --exclude='*.bak' \
            --exclude='*.old' \
            --exclude='*.orig' \
            --exclude='*.save' \
            --exclude='*.swp' \
            --exclude='all_php_merged.txt' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE' \
            --exclude='CONTRIBUTING.md' \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Post-Deploy Tasks (Composer & Migrations)
        env:
          DEPLOY_PATH: "/var/www/vhosts/projecthumanity.space"
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"

            echo "Running composer install..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "Running migrations..."
            # Проверяем, что файл существует перед запуском
            if [ -f "bin/run_migrations.php" ]; then
              php bin/run_migrations.php
            else
              echo "ERROR: bin/run_migrations.php not found!"
              exit 1
            fi

            echo "Deployment finished successfully."
          EOF

      - name: Health Check
        run: |
          curl -f -k https://projecthumanity.space/ || curl -f http://projecthumanity.space/
